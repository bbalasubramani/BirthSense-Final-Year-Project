services:
  - type: web
    name: birthsense-backend
    env: node
    buildCommand: cd backend && npm install && python3 -m pip install -r requirements.txt
    startCommand: cd backend && npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
        key: FRONTEND_ORIGIN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PORT
        value: 10000
